<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Lishu 🎀</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <!-- VS Code Intro Scene -->
  <div id="vscode-intro">
    <div class="code-panel"><h3>index.html</h3><pre><code>&lt;div class="card"&gt;</code></pre></div>
    <div class="code-panel"><h3>script.js</h3><pre><code>startParty();</code></pre></div>
    <div class="code-panel"><h3>style.css</h3><pre><code>.card { flex; }</code></pre></div>
  </div>

  <!-- Main Animated Card -->
  <div id="main-canvas" class="hidden">
    <div class="bunting-flags"></div>

    <!-- Left Section -->
    <div class="panel-left">
      <h1 class="hb-title">Happy<br>Birthday</h1>
      <div class="date-badge">★ 17 Oct ★</div>
      <div class="btn-group">
        <button class="action-btn" onclick="openEnvelope()">Envelope Of Love ✉️</button>
        <button class="action-btn" onclick="openCard()">Greeting Card 📖</button>
      </div>
    </div>

    <!-- Center Cake -->
    <div class="panel-center">
      <div class="cake-container" id="cake">
        <div class="cake-text">Happy 22nd Birthday!<br><span>Lishu 🎀</span></div>
      </div>
    </div>

    <!-- Right Section -->
    <div class="panel-right">
      <div class="profile-circle">
        <img src="https://i.ibb.co/6P0L8pT/anime-girl.jpg" alt="Lishu">
      </div>
      <div class="name-badge">Dear Lishu</div>
    </div>
  </div>

  <!-- Modals -->
  <div class="modal" id="cardModal">
    <div class="modal-box">
      <span class="close-btn" onclick="closeModal('cardModal')">&times;</span>
      <h2>📖 Greeting Card</h2>
      <p>To You! Happy Birthday, Lishu... <br><br>Wishing you all the happiness and joy! ✨</p>
    </div>
  </div>

  <div class="modal" id="envelopeModal">
    <div class="modal-box">
      <span class="close-btn" onclick="closeModal('envelopeModal')">&times;</span>
      <div class="heart-icon">❤️</div>
      <h2>Envelope Of Love</h2>
      <button class="love-btn" onclick="triggerLovePopups()">Open</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
